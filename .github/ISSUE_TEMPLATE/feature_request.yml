name: Feature Request
description: Suggest an improvement or new feature for NidoOffice
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Feature
      description: Describe the feature or workflow improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use Case
      description: How would this help your document, spreadsheet, presentation, or PDF workflow?
    validations:
      required: false
